name: Diagnose online music sources (temporary)

on:
  push:
    branches: ['claude/**']
    paths: ['.github/workflows/diagnose.yml', '.github/diagnose/**']

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audius stream check
        run: |
          set +e
          curl -sS "https://api.audius.co/v1/tracks/search?query=lofi&app_name=MyMusicPlayer" > /tmp/au.json
          python3 - <<'PY'
          import json, subprocess
          d = json.load(open('/tmp/au.json'))['data']
          ok = [t for t in d if t.get('is_streamable') is not False and not t.get('stream_conditions')]
          print('total', len(d), 'streamable', len(ok))
          for t in ok[:3]:
              print('stream field:', json.dumps(t.get('stream'))[:300], '| access:', json.dumps(t.get('access')))
              out = subprocess.run(['curl', '-sS', '-I', '-H', 'Origin: https://goodlaith01.github.io', f"https://api.audius.co/v1/tracks/{t['id']}/stream?app_name=MyMusicPlayer"], capture_output=True, text=True).stdout
              print('\n'.join(l for l in out.splitlines() if l.lower().startswith(('http', 'location', 'content-type', 'access-control'))))
          PY
      - name: Live site in a real browser
        run: |
          npm i --no-save playwright-core@1.56.1 2>&1 | tail -2
          node .github/diagnose/site.mjs
