name: Diagnose online music sources (temporary)

on:
  push:
    branches: ['claude/**']
    paths: ['.github/workflows/diagnose.yml', '.github/diagnose/**']

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Deezer from iPhone user agent
        run: |
          set +e
          UA='Mozilla/5.0 (iPhone; CPU iPhone OS 18_5 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/18.5 Mobile/15E148 Safari/604.1'
          echo "### search plain"
          curl -sS -D /tmp/h.txt -o /tmp/dz.json -A "$UA" -H 'Origin: https://goodlaith01.github.io' "https://api.deezer.com/search/track?q=adele&limit=3"
          grep -i -E '^(HTTP|access-control|content-type|location)' /tmp/h.txt
          head -c 1800 /tmp/dz.json; echo
          echo "### search jsonp"
          curl -sS -A "$UA" "https://api.deezer.com/search/track?q=adele&limit=1&output=jsonp&callback=cb" | head -c 300; echo
          echo "### track lookup jsonp"
          ID=$(python3 -c "import json;print(json.load(open('/tmp/dz.json'))['data'][0]['id'])")
          curl -sS -A "$UA" "https://api.deezer.com/track/$ID?output=jsonp&callback=cb" | head -c 300; echo
          echo "### preview"
          PV=$(python3 -c "import json;print(json.load(open('/tmp/dz.json'))['data'][0]['preview'])")
          echo "$PV"
          curl -sS -I -A "$UA" "$PV" | grep -i -E '^(HTTP|content-type|content-length|access-control)'
          echo "### arabic query"
          curl -sS "https://api.deezer.com/search/track?q=%D8%B9%D9%85%D8%B1%D9%88%20%D8%AF%D9%8A%D8%A7%D8%A8&limit=3" | python3 -c "import json,sys;[print(t['title'],'|',t['artist']['name'],'|',bool(t['preview'])) for t in json.load(sys.stdin)['data']]"
