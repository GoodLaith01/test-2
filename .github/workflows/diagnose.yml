name: Diagnose online music sources (temporary)

on:
  push:
    branches: ['claude/**']
    paths: ['.github/workflows/diagnose.yml', '.github/diagnose/**']

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: iTunes from iPhone user agent
        run: |
          set +e
          UA='Mozilla/5.0 (iPhone; CPU iPhone OS 18_5 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/18.5 Mobile/15E148 Safari/604.1'
          try() {
            echo "### $1"
            curl -sS -o /tmp/r.txt -w 'code=%{http_code} redirect=%{redirect_url} type=%{content_type}\n' -A "$UA" -H 'Origin: https://goodlaith01.github.io' -H 'Accept: application/json' "$1"
            grep -i -o -m1 'access-control-allow-origin' <(curl -sS -D - -o /dev/null -A "$UA" -H 'Origin: https://goodlaith01.github.io' "$1")
            head -c 160 /tmp/r.txt | tr '\n' ' '; echo
          }
          Q='term=adele&media=music&entity=song&limit=3'
          try "https://itunes.apple.com/search?$Q"
          try "https://itunes.apple.com/search?$Q&country=US"
          try "https://itunes.apple.com/us/search?$Q"
          try "https://itunes.apple.com/search?$Q&callback=cb"
          try "https://mzstoreservices-mr.itunes.apple.com/search?$Q"
          try "https://itunes.apple.com/WebObjects/MZStoreServices.woa/wa/wsSearch?$Q"
          try "https://itunes.apple.com/lookup?id=262836961&entity=song&limit=3"
          try "https://itunes.apple.com/search?$Q&lang=en_us&explicit=Yes"
